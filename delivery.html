<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Agent</title><link rel="stylesheet" href="./style.css"></head>
<body class="admin-body">
  <header class="admin-header"><div><strong>Delivery Agent</strong><small id="agent-name">Kharagpur Fresh</small></div><button id="logout" class="header-button" type="button" hidden>Logout</button></header>
  <main class="admin-page">
    <form id="login-view" class="admin-card admin-login"><h2>Agent login</h2><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="primary-button" type="submit">Sign in</button></form>
    <section id="agent-dashboard" hidden>
      <div class="admin-card"><div class="section-heading"><h2>Status</h2><label class="toggle-row"><span id="online-label">Online</span><input id="online-toggle" type="checkbox" checked></label></div></div>
      <div class="metric-grid" id="agent-summary"></div>
      <section id="order-list" class="admin-card"><h2>Assigned orders</h2><div id="assigned-orders">Loading…</div></section>
    </section>
  </main>
  <div id="new-order-popup" class="closed-screen" hidden><div class="admin-card" style="max-width:420px;width:calc(100% - 28px)"><div class="success-icon">K</div><h2>New delivery request</h2><div id="popup-details"></div><div class="admin-order-actions"><button id="accept-order" class="primary-button" type="button">Accept</button><button id="reject-order" class="danger-button" type="button">Reject</button></div></div></div>
  <div id="toast" class="toast"></div>
  <audio id="order-sound" preload="auto" loop><source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav"></audio>
  <script type="module" src="./delivery.js?v=3"></script>
</body>
</html>
